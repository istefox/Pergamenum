# they REMOVE a leniency; this feature ADDS a constraint, so absent/empty must equal the
# pre-feature behaviour (ADR-0055 §D2's rule, applied here per ADR-0060). Populated at Gate
# 2c from the architect's EXTERNAL DEPENDENCY: lines, confirmed by the operator.
