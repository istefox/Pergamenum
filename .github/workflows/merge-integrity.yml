name: Merge integrity

# ADR-0061, causa radice di PG-240 (issue #522): un merge commit ha scartato
# in silenzio 15 file già mersi da PR #515 quando PR #519 ha unito un branch
# di sync stantio, e git non aveva nulla da segnalare perché nessun conflitto
# reale copriva quei path. scripts/check-merge-integrity.py rifà il merge con
# `git merge-tree` e confronta: un path che differisce dal calcolo di git
# senza essere mai stato in conflitto è un lato preso in blocco.
#
# Workflow separato da ci.yml, non uno step in più: ci.yml ha
# `paths-ignore: [docs/**, TODO.md, *.md]`, e la PR che ha causato PG-240 era
# esattamente un sync di TODO.md — avrebbe saltato ci.yml del tutto. Qui non
# c'è alcun paths-ignore.
#
# Advisory, mai un required check (ADR-0044 §D11): main resta senza branch
# protection, la disciplina resta l'unica guardia. Il blocco vero è
# scripts/install-git-hooks.sh, sulla macchina, prima del push — vedi §D3.
#
# ADR-0062 (PG-242, issue #535) aggiunge il controllo di landing: uno squash o
# un rebase non lascia merge commit da ispezionare, quindi si guarda il
# contenuto che atterrerebbe su main (`--landing BASE HEAD`) e si fallisce su
# un path che torna a un blob che main aveva già superato. Lo step della PR
# NON usa pull_request.base.sha come base: GitHub non documenta quando viene
# aggiornato, e una base stantia attribuirebbe alla PR i landing successivi di
# main (compresi i suoi ripristini voluti). Risolve invece origin/<base.ref>
# dentro il job, dopo il checkout con fetch-depth 0 (§D3), e stampa entrambi.
# Gli step di landing girano anche se lo scan dei merge è rosso (!cancelled()):
# un fallimento non deve nasconderne un altro (§D7).
#
# Una base di landing che non si risolve nel job (origin/<base.ref> assente, o
# un commit radice senza genitore) stampa un ::warning:: e salta lo step, come
# fa l'hook: mai un rosso per un landing che non si può valutare (PG-247).
# Il lancio manuale guarda il branch rispetto a origin/main, come una PR: una
# finestra fissa sulla storia di main (era origin/main~200..HEAD) conteneva il
# caso storico 14d8851 e finiva rossa a ogni lancio (PG-245).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: merge-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge integrity (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check-merge-integrity.py \
            --pr-base "$PR_BASE_SHA" \
            --pr-head "$PR_HEAD_SHA" \
            --verbose

      - name: Check merge integrity (push to main)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          before="$PUSH_BEFORE"
          after="$PUSH_AFTER"
          forced="$PUSH_FORCED"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || [ "$forced" = "true" ]; then
            # Branch nuovo, o riscrittura forzata: "before" non è un antenato
            # affidabile. Esamina solo il commit di merge in punta, se lo è.
            range="${after}~1..${after}"
          else
            range="${before}..${after}"
          fi
          python3 scripts/check-merge-integrity.py --range "$range" --verbose

      - name: Check landing (pull_request)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! base="$(git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF^{commit}")"; then
            echo "::warning::base origin/$BASE_REF non disponibile nel job, controllo di landing saltato"
            exit 0
          fi
          git --version
          echo "base.sha dell'evento: $PR_BASE_SHA"
          echo "base risolta (origin/$BASE_REF): $base"
          python3 scripts/check-merge-integrity.py --landing "$base" "$PR_HEAD_SHA"

      - name: Check landing (push to main)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          before="$PUSH_BEFORE"
          after="$PUSH_AFTER"
          forced="$PUSH_FORCED"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || [ "$forced" = "true" ]; then
            # Stesso ripiego dello step dei merge: "before" non è un antenato
            # affidabile, si valuta il solo commit in punta sul suo primo genitore.
            if ! base="$(git rev-parse --verify --quiet "${after}^1")"; then
              echo "::warning::${after} non ha un primo genitore, controllo di landing saltato"
              exit 0
            fi
          else
            base="$before"
          fi
          python3 scripts/check-merge-integrity.py --landing "$base" "$after"

      - name: Check merge integrity (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 scripts/check-merge-integrity.py --range "origin/main..HEAD" --verbose

      - name: Check landing (manual dispatch)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if ! base="$(git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}")"; then
            echo "::warning::base origin/main non disponibile nel job, controllo di landing saltato"
            exit 0
          fi
          echo "base risolta (origin/main): $base"
          python3 scripts/check-merge-integrity.py --landing "$base" HEAD
