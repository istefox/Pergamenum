name: Merge integrity

# ADR-0061, causa radice di PG-240 (issue #522): un merge commit ha scartato
# in silenzio 15 file già mersi da PR #515 quando PR #519 ha unito un branch
# di sync stantio, e git non aveva nulla da segnalare perché nessun conflitto
# reale copriva quei path. scripts/check-merge-integrity.py rifà il merge con
# `git merge-tree` e confronta: un path che differisce dal calcolo di git
# senza essere mai stato in conflitto è un lato preso in blocco.
#
# Workflow separato da ci.yml, non uno step in più: ci.yml ha
# `paths-ignore: [docs/**, TODO.md, *.md]`, e la PR che ha causato PG-240 era
# esattamente un sync di TODO.md — avrebbe saltato ci.yml del tutto. Qui non
# c'è alcun paths-ignore.
#
# Advisory, mai un required check (ADR-0044 §D11): main resta senza branch
# protection, la disciplina resta l'unica guardia. Il blocco vero è
# scripts/install-git-hooks.sh, sulla macchina, prima del push — vedi §D3.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: merge-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge integrity (pull_request)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check-merge-integrity.py \
            --pr-base "$PR_BASE_SHA" \
            --pr-head "$PR_HEAD_SHA" \
            --verbose

      - name: Check merge integrity (push to main)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          before="$PUSH_BEFORE"
          after="$PUSH_AFTER"
          forced="$PUSH_FORCED"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || [ "$forced" = "true" ]; then
            # Branch nuovo, o riscrittura forzata: "before" non è un antenato
            # affidabile. Esamina solo il commit di merge in punta, se lo è.
            range="${after}~1..${after}"
          else
            range="${before}..${after}"
          fi
          python3 scripts/check-merge-integrity.py --range "$range" --verbose

      - name: Check merge integrity (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 scripts/check-merge-integrity.py --range "origin/main~200..HEAD" --verbose
